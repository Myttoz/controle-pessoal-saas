name: Publicar versão web (GitHub Pages)

# Roda automaticamente a cada envio para a branch "main".
# Também pode ser disparado manualmente em Actions → Run workflow.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Montar site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ganhos-gastos

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: ganhos-gastos/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build web
        # A chave "publishable/anon" do Supabase é pública por design
        # (vai no bundle do site); a proteção dos dados é feita por RLS.
        # Se quiser trocar o projeto, defina os secrets no GitHub.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://srojhhwpwfjbotuphoxq.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_kcVOc7NhsDkX2Z09f-QR8A_nVrG4Yty' }}
        run: npm run build:web

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Copiar feeds RSS/XML para o site
        run: cp releases.rss releases.xml ganhos-gastos/dist-web/

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ganhos-gastos/dist-web

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
