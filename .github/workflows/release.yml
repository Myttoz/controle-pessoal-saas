name: Release

# Disparado quando você cria/envia uma tag `v*` (ex.: v1.0.0).
# Quem cria a tag manda o destravamento.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código (histórico completo, para gerar as notas)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Gerar Release a partir do RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            --repo "${{ github.repository }}"

      - name: Atualizar feeds RSS/XML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gerar_feed.py

      - name: Publicar feeds no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.xml releases.rss
          if git diff --cached --quiet; then
            echo "Feeds já atualizados."
          else
            git commit -m "Atualiza feeds RSS com a nova release"
            git push origin master
          fi

      # Commits feitos com GITHUB_TOKEN não disparam outros workflows:
      # força o deploy do Pages para publicar o feed novo.
      - name: Mandar publicar o site com o feed novo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-web.yml --ref master
